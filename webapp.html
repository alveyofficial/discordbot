<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Authentication</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <h1>Staff Authentication</h1>
      <p>Sign in with a short-lived staff token or Discord OAuth.</p>
      <div id="auth-error" class="error-message hidden"></div>
      <div id="auth-success" class="success-message hidden">Authentication successful.</div>
      <form id="auth-form">
        <label for="auth-token">Authentication Code</label>
        <input type="text" id="auth-token" placeholder="Enter authentication code" required autofocus>
        <button type="submit" class="btn btn-primary">Authenticate</button>
      </form>
      <button id="discord-auth-btn" class="btn btn-secondary">Continue with Discord</button>
    </section>
  </main>

  <script type="module">
    const authForm = document.getElementById('auth-form');
    const authTokenInput = document.getElementById('auth-token');
    const authError = document.getElementById('auth-error');
    const authSuccess = document.getElementById('auth-success');
    const discordAuthButton = document.getElementById('discord-auth-btn');

    const urlToken = new URLSearchParams(window.location.search).get('token');
    if (urlToken) {
      authTokenInput.value = urlToken;
      authenticate(urlToken);
      window.history.replaceState({}, '', '/');
    }

    authForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const token = authTokenInput.value.trim();
      if (token) authenticate(token);
    });

    discordAuthButton.addEventListener('click', async () => {
      hideMessages();
      try {
        const response = await fetch('/api/discord-auth-url');
        if (!response.ok) {
          showError('Discord authentication is not configured.');
          return;
        }
        const { url } = await response.json();
        window.location.href = url;
      } catch {
        showError('Failed to start Discord authentication.');
      }
    });

    async function authenticate(token) {
      hideMessages();
      try {
        const response = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (response.ok) {
          authSuccess.classList.remove('hidden');
          return;
        }
        const error = await response.json().catch(() => ({}));
        showError(error.error || 'Invalid or expired token.');
      } catch {
        showError('Failed to authenticate.');
      }
    }

    function showError(message) {
      authError.textContent = message;
      authError.classList.remove('hidden');
    }

    function hideMessages() {
      authError.classList.add('hidden');
      authSuccess.classList.add('hidden');
    }
  </script>
</body>
</html>
